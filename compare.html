<script>
let phones=[];const selected=[null,null];const button=document.getElementById('compareButton');const msg=document.getElementById('message');const result=document.getElementById('comparison');
const normalize=s=>String(s||'').toLocaleLowerCase().replace(/[\s\-_]+/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
function pick(i,p){selected[i]=p;document.getElementById('search'+(i+1)).value=p.name;document.getElementById('chosen'+(i+1)).textContent='✓ '+p.name;document.getElementById('options'+(i+1)).replaceChildren();button.disabled=!(selected[0]&&selected[1]);result.hidden=true;document.getElementById('insights').hidden=true;msg.textContent='';}
function setup(i){const input=document.getElementById('search'+(i+1)),list=document.getElementById('options'+(i+1));input.addEventListener('input',()=>{selected[i]=null;button.disabled=true;result.hidden=true;document.getElementById('insights').hidden=true;document.getElementById('chosen'+(i+1)).textContent='';list.replaceChildren();const q=normalize(input.value.trim());if(!q)return;const matches=phones.filter(p=>[p.name,p.model,(p.brand || '')+' '+p.model,...(p.aliases||[])].some(s=>normalize(s).includes(q))).slice(0,12);if(!matches.length){list.textContent='ما لقينا هاتف بهذا الاسم';return;}matches.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=p.name;b.addEventListener('click',()=>pick(i,p));list.appendChild(b);});});}
setup(0);setup(1);
function td(text,tag='td'){const el=document.createElement(tag);el.textContent=text;return el;}
function compare(){const [a,b]=selected;if(!a||!b)return;if(a.id===b.id){msg.textContent='اختَر هاتفين مختلفين حتى نقارن بينهم.';return;}msg.textContent='';const table=document.createElement('table');const head=document.createElement('tr');head.appendChild(td('المواصفة','th'));for(const p of [a,b]){
 const th=document.createElement('th');
 const photo=document.createElement('img');
 photo.className='phone-photo';photo.alt='صورة '+p.name;photo.loading='lazy';
 const placeholder=document.createElement('div');placeholder.className='phone-placeholder';placeholder.textContent='📱';
 const imagePath = p.image || '';
 if (imagePath) {
   photo.src = imagePath;
   photo.onerror = () => { photo.onerror = null; photo.src = 'phone-placeholder.svg'; };
   th.appendChild(photo);
 } else { th.appendChild(placeholder); }
 const link=document.createElement('a');link.className='phone-link';link.textContent=p.name;link.href=p.page||'index.html';
 th.appendChild(link);head.appendChild(th);
}table.appendChild(head);
const keys = [...new Set([
  ...Object.keys(a.specs || {}),
  ...Object.keys(b.specs || {})
])];

function getCompareValue(key, value) {
  if (!value || typeof value !== 'string') return null;

  const text = value.replace(/,/g, '');

  if (key === 'البطارية') {
    const m = text.match(/(\d{4,5})\s*mAh/i);
    return m ? Number(m[1]) : null;
  }

  if (key === 'الشاشة') {
    const matches = [...text.matchAll(/(\d{2,3})\s*Hz/gi)];
    return matches.length
      ? Math.max(...matches.map(m => Number(m[1])))
      : null;
  }

  if (key === 'الدقة') {
    const m = text.match(/(\d{3,4})\s*[×xX]\s*(\d{3,4})/);
    return m ? Number(m[1]) * Number(m[2]) : null;
  }

  if (key === 'الذاكرة') {
    const m = text.match(/(\d+)\s*GB/i);
    return m ? Number(m[1]) : null;
  }

  if (key === 'التخزين') {
    const sizes = [...text.matchAll(/(\d+)\s*(TB|GB)/gi)]
      .map(m => Number(m[1]) * (m[2].toUpperCase() === 'TB' ? 1024 : 1));
    return sizes.length ? Math.max(...sizes) : null;
  }

  return null;
}

keys.forEach(key => {
  const tr = document.createElement('tr');

  const valueA = a.specs?.[key] || 'غير متوفر';
  const valueB = b.specs?.[key] || 'غير متوفر';

  const cellA = td(valueA);
  const cellB = td(valueB);

  const numA = getCompareValue(key, valueA);
  const numB = getCompareValue(key, valueB);

  if (numA !== null && numB !== null && numA !== numB) {
    if (numA > numB) {
      cellA.classList.add('spec-winner');
    } else {
      cellB.classList.add('spec-winner');
    }
  }

  tr.append(td(key), cellA, cellB);
  table.appendChild(tr);
});
// درجات تقنية تقديرية محسوبة بقواعد معلنة، وليست نتائج اختبارات فعلية.
const metrics=['الأداء','الشاشة','الكاميرات','البطارية','الشحن'];
const clamp=n=>Math.max(0,Math.min(10,n));
const numeric=(s,re)=>{const m=String(s||'').replace(/,/g,'').match(re);return m?Number(m[1]):null};
const field=(p,k)=>String(p.specs?.[k]||'');
function rate(p){
 const cpu=field(p,'المعالج').toLowerCase();
 let performance=null;
 if(cpu.includes('8 elite gen 5'))performance=9.5;
 else if(cpu.includes('8 elite'))performance=9;
 else if(cpu.includes('a19pro')||cpu.includes('a19 pro'))performance=9.3;
 else if(cpu.includes('8300'))performance=7.3;
 const display=field(p,'الشاشة');
 const hz=numeric(display,/(\d{2,3})\s*hz/i);
 const resolution=field(p,'الدقة');
 const dims=resolution.match(/(\d{3,4})\s*[×xX]\s*(\d{3,4})/);
 const pixels=dims?Number(dims[1])*Number(dims[2]):null;
 const screen=hz!=null?clamp(5.5+Math.min(hz,144)/144*2.5+(pixels!=null?(pixels>=4000000?2:pixels>=3000000?1.5:1):0)):null;
 const main=field(p,'الكاميرا الرئيسية'),tele=field(p,'التقريب'),wide=field(p,'الواسعة جداً');
 // درجة تجهيزات التصوير، لا جودة الصور؛ لا تُكافئ زيادة MP تلقائياً.
 const camera=main?clamp(5.5+(tele?1.5:0)+(wide?1:0)+(/ois/i.test(main)?1:0)+(/ois/i.test(tele)?0.5:0)+(/1 بوصة|1\/1\.3/i.test(main)?0.5:0)):null;
 const batteryText=field(p,'البطارية');
 const mah=numeric(batteryText,/(\d{4,5})\s*mah/i);
 const watts=numeric(batteryText,/(\d{2,3})\s*w\b/i);
 const battery=mah!=null?clamp(2+Math.min(mah,8500)/8500*8):null;
 const charging=watts!=null?clamp(2+Math.min(watts,150)/150*8):null;
 return {'الأداء':performance,'الشاشة':screen,'الكاميرات':camera,'البطارية':battery,'الشحن':charging};
}
function renderInsights(a,b){
 const area=document.getElementById('insights');area.replaceChildren();area.hidden=false;
 const h=document.createElement('h2');h.textContent='المقارنة البيانية والتحليل (من 10)';area.appendChild(h);
 const desc=document.createElement('p');desc.textContent='درجات تقديرية للمواصفات المعلنة، وليست اختبارات فعلية. الأداء يعتمد على فئة المعالج، والشاشة على التردد والدقة، والكاميرات على تجهيزات العدسات والتثبيت، والبطارية على السعة، والشحن على القدرة المعلنة. تقييم القيمة مقابل السعر خارج المخطط إلى حين توفر أسعار عراقية موثوقة.';area.appendChild(desc);
 const x=rate(a),y=rate(b),colors=['#7545ce','#f59e0b'];
 const legend=document.createElement('div');legend.className='radar-legend';[a,b].forEach((p,i)=>{const el=document.createElement('span');el.style.setProperty('--dot',colors[i]);el.textContent=p.name;legend.appendChild(el)});area.appendChild(legend);
 const NS='http://www.w3.org/2000/svg';const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 560 440');svg.setAttribute('class','radar');svg.setAttribute('role','img');svg.setAttribute('aria-label','مخطط خماسي لدرجات تقنية تقديرية من عشرة');
 const add=(tag,attrs,content)=>{const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(content!=null)el.textContent=content;svg.appendChild(el);return el;};
 const cx=280,cy=218,R=140;const point=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/5;return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
 for(let ring=1;ring<=5;ring++)add('polygon',{points:metrics.map((_,i)=>point(i,R*ring/5).join(',')).join(' '),fill:'none',stroke:'#e5e7eb','stroke-width':1.5});
 metrics.forEach((m,i)=>{const [px,py]=point(i,R);add('line',{x1:cx,y1:cy,x2:px,y2:py,stroke:'#d1d5db'});const [tx,ty]=point(i,R+52);add('text',{x:tx,y:ty,'text-anchor':'middle','dominant-baseline':'middle',fill:'#21152f','font-size':'14','font-family':'Cairo'},m)});
 [x,y].forEach((values,j)=>{const valid=metrics.map((m,i)=>values[m]==null?null:point(i,R*values[m]/10));
  if(valid.every(Boolean))add('polygon',{points:valid.map(v=>v.join(',')).join(' '),fill:colors[j],'fill-opacity':'.14',stroke:colors[j],'stroke-width':3});
  else valid.forEach((v,i)=>{if(v&&valid[(i+1)%5])add('line',{x1:v[0],y1:v[1],x2:valid[(i+1)%5][0],y2:valid[(i+1)%5][1],stroke:colors[j],'stroke-width':3});});
  valid.forEach(v=>{if(v)add('circle',{cx:v[0],cy:v[1],r:5,fill:colors[j],stroke:'#fff','stroke-width':2})});
 });area.appendChild(svg);
 const grid=document.createElement('div');grid.className='analysis-grid';
 [a,b].forEach((p,j)=>{const vals=j===0?x:y;const card=document.createElement('div');card.className='analysis-card';const title=document.createElement('h3');title.textContent=p.name;card.appendChild(title);const ul=document.createElement('ul');metrics.forEach(m=>{const li=document.createElement('li');const v=vals[m],other=(j===0?y:x)[m];li.textContent=m+': '+(v==null?'غير محسوب':v.toFixed(1)+'/10'+(other!=null?(v>other?' — أعلى تقديرياً':v<other?' — أقل تقديرياً':' — متساوي'):''));ul.appendChild(li)});card.appendChild(ul);if(p.strengths?.length){const detail=document.createElement('p');detail.textContent='نقاط قوة مذكورة بصفحة الهاتف:';card.appendChild(detail);const extras=document.createElement('ul');p.strengths.slice(0,3).forEach(t=>{const li=document.createElement('li');li.textContent=t;extras.appendChild(li)});card.appendChild(extras)}grid.appendChild(card)});area.appendChild(grid);
 const note=document.createElement('p');note.textContent='مهم: الدرجات تقريبية وفق قواعد ثابتة وليست مراجعة مخبرية. تقييم الكاميرات يعكس تجهيزاتها فقط، وليس جودة الصور. عند غياب أي معلومة نترك درجتها غير محسوبة بدلاً من اختراع رقم. القيمة مقابل السعر تحتاج أسعاراً عراقية موثوقة.';area.appendChild(note);
}

result.replaceChildren(table);
result.hidden = false;
renderInsights(a,b);
}

button.addEventListener('click', () => {
  compare();

  if (!result.hidden) {
    document.querySelector('.pickers').hidden = true;
    button.hidden = true;
    newCompare.hidden = false;
    msg.hidden = true;

    result.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
